name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        if: matrix.node-version == '24'
        run: npm run lint

      - name: Verify dist output
        run: |
          TOOLS=$(node -e "const { getAllTools } = require('./dist/tools/index.js'); console.log(getAllTools().length);")
          echo "Tools in dist: $TOOLS"
          if [ "$TOOLS" -lt 20 ]; then echo "ERROR: Expected at least 20 tools, got $TOOLS"; exit 1; fi

      - name: Check for vulnerabilities
        if: matrix.node-version == '24'
        run: npm audit --audit-level=high

      - name: Verify package contents
        if: matrix.node-version == '24'
        run: npm pack --dry-run

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: --recursive .

      - name: Secret scan
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 # v8.30.0
        with:
          args: detect --source=/github/workspace --no-banner --redact --verbose

  publish-gh:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: [build-and-test, audit]
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify release version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME#v}" = "$PACKAGE_VERSION"

      - name: Publish to GitHub Packages
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already present in GitHub Packages"
          else
            npm publish --registry=https://npm.pkg.github.com
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build-and-test, audit]
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Use npmjs registry for package scope
        run: npm config delete @daniyal0100101:registry --location=project

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify release version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME#v}" = "$PACKAGE_VERSION"

      - name: Publish to npm
        run: npm publish --registry=https://registry.npmjs.org --access public --provenance
